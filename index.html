<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="googlebot" content="noindex, nofollow, noarchive"><title>KarEve Shipments</title>
<style>
:root{--navy:#0d1b36;--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--mut:#667085;--line:#e6e9f0;--blue:#2f6fed;--r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input,textarea{font:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:14px 28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}.asof{font-size:12px;opacity:.7}
.top .sp{flex:1}.top input{width:min(360px,100%);padding:9px 14px;border-radius:10px;border:0;background:#1d2d50;color:#fff}.top input::placeholder{color:#9fb0d0}
.tbtn{background:#22345c;color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}.tbtn:hover{background:#2c4374}
.tbtn .ct{background:#ffb020;color:#111;border-radius:9px;padding:0 7px;margin-left:6px;font-size:12px;font-weight:700}
.live{font-size:11.5px;border-radius:999px;padding:4px 10px;background:#1d3a2a;color:#8ef0b5;white-space:nowrap}
.live.off{background:#3a2a12;color:#ffd79a}
main{padding:24px 28px 60px;max-width:1700px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:22px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;cursor:pointer;border:2px solid transparent;transition:.15s}
.kpi:hover{transform:translateY(-1px)}.kpi.on{border-color:var(--blue)}.kpi .n{font-size:30px;font-weight:700;line-height:1.1}.kpi .l{color:var(--mut);font-size:13px;margin-top:4px}
.kpi.red .n{color:#d92d20}.kpi.amb .n{color:#b54708}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;background:#e7ebf3;border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:7px 16px;border-radius:8px;cursor:pointer;color:var(--mut)}.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.bar select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff}.bar label{color:var(--mut);font-size:13px}
.help{font-size:12px;color:var(--mut);background:#fff;border:1px dashed #cdd5e3;border-radius:10px;padding:7px 12px}
.board{display:flex;gap:18px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 310px;background:#eceff5;border-radius:16px;padding:12px;min-height:160px;transition:outline .12s,background .12s}
.col h3{margin:4px 6px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.col.dragover{outline:2px dashed var(--blue);background:#e0eaff}
.col.collapsed{flex-basis:210px;min-height:auto}
.col.collapsed .col-body{display:none}
.col-toggle{border:0;background:#fff;border-radius:8px;padding:3px 8px;cursor:pointer;color:var(--mut);font-size:11.5px}
.drop-hint{font-size:12px;color:var(--mut);padding:8px 6px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;cursor:grab;border-left:4px solid var(--c,#ccc);transition:.15s;user-select:none;touch-action:none}
.card:hover{box-shadow:0 6px 20px rgba(16,24,40,.12)}
.card.dragging{opacity:.45}
.ghost-float{position:fixed;pointer-events:none;z-index:40;margin:0;box-shadow:0 12px 30px rgba(16,24,40,.25);transform:rotate(2deg)}
.card .k{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:6px}.card .t{font-weight:600;margin:4px 0 8px;line-height:1.35}
.meta{font-size:12.5px;color:#3d4659;display:grid;gap:3px}.meta span{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11.5px;border-radius:999px;padding:3px 10px;background:#eef2f8;color:#344054}
.chip.act{background:#eef4ff;color:#1d4ed8}.chip.red{background:#fee4e2;color:#b42318}.chip.amb{background:#fef0c7;color:#93370d}.chip.grn{background:#dcfae6;color:#067647}.chip.stale{background:#eaecf0;color:#475467}.chip.pend{background:#ffb020;color:#111;font-weight:600}
.card a.nl{font-size:12px;color:var(--blue);text-decoration:none;cursor:pointer}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--cb);color:var(--c)}
.tw{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:auto;max-height:calc(100vh - 290px)}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1150px}
th{position:sticky;top:0;background:#f8f9fc;text-align:left;padding:13px 16px;font-size:12px;color:var(--mut);font-weight:600;cursor:pointer;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid #f0f2f6;vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover td{background:#f9fbff}
.panel{position:fixed;inset:0 0 0 auto;width:min(760px,100%);background:#fff;box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .22s;z-index:20;display:flex;flex-direction:column}
.panel.open{transform:none}.ph{padding:22px 28px 16px;border-bottom:1px solid var(--line)}.ph h2{margin:6px 0 10px;font-size:19px;line-height:1.35}
.pb{padding:8px 28px 40px;overflow:auto;flex:1}.x{position:absolute;right:18px;top:16px;border:0;background:#f2f4f7;border-radius:10px;width:36px;height:36px;font-size:20px;cursor:pointer}
.sec{margin-top:22px}.sec h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:0 0 10px}
.grid{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:13.5px}.grid div:nth-child(odd){color:var(--mut)}
.box{background:#f8f9fc;border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:13px;word-break:break-word}
.actions{background:#f6f8ff;border:1px solid #dfe6ff;border-radius:14px;padding:16px 18px}
.actions label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}.actions select,.actions textarea,.actions input{width:100%;padding:9px 11px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}
.actions textarea{min-height:74px;resize:vertical}.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--blue);color:#fff}.b.s{background:#e4e7ec;color:#1a2233}.b.g{background:#12b76a}
.log{font-size:12.5px;margin-top:10px}.log div{padding:6px 0;border-bottom:1px dashed #e4e7ec}
.tray{position:fixed;right:28px;top:76px;width:min(560px,94vw);max-height:70vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:18px 20px;z-index:15;display:none}
.tray.open{display:block}.tray pre,.tray .sendbox{white-space:pre-wrap;background:#f8f9fc;border-radius:10px;padding:12px;font-size:12.5px;max-height:40vh;overflow:auto;width:100%;border:1px solid var(--line);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d1b36;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;display:none;box-shadow:var(--sh)}
.empty{color:var(--mut);font-size:13px;padding:10px}
body.viewonly .card{cursor:pointer;user-select:text}
body.viewonly .drop-hint{display:none}
body.viewonly #trayBtn,body.viewonly #tray{display:none!important}

.kpi.stat{cursor:default}.kpi.stat:hover{transform:none}
.kpi .sub{font-size:12px;color:var(--mut);margin-top:2px}
.spend{display:grid;gap:20px}
.month,.invbox{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px 22px}
.month h3,.invbox h3{margin:0 0 14px;font-size:15px;font-weight:650}
.month table{min-width:0;width:100%}
.month th{cursor:default}
.month td,.month th{padding:10px 12px}
.month tbody tr{cursor:default}
.month tbody tr:hover td{background:transparent}
.mbar{height:8px;background:#eef2f8;border-radius:99px;margin-top:6px;overflow:hidden;min-width:70px}
.mbar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.mbar.cad>i{background:#0e7090}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.split .kpi{cursor:pointer}
a.shp{font-weight:650;color:var(--blue);text-decoration:none;cursor:pointer}
a.shp:hover{text-decoration:underline}
.spend .tw{max-height:calc(100vh - 240px);margin-top:12px}
.spend-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 4px}
.muted{color:var(--mut);font-size:12.5px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
@media(max-width:720px){.top,main{padding-left:14px;padding-right:14px}.grid,.pair{grid-template-columns:1fr}.col{flex-basis:85vw}.pb,.ph{padding-left:18px;padding-right:18px}}

function bindBoard(){
  var board=$('view').querySelector('.board');if(!board)return;
  Array.from(board.querySelectorAll('.col-toggle')).forEach(function(b){b.onclick=function(ev){ev.preventDefault();ev.stopPropagation();var s=b.getAttribute('data-toggle');collapsed[s]=collapsed[s]?0:1;render()}});
  if(VO)return;
  var dragId=null,moved=false,ghost=null,sx=0,sy=0;
  function endGhost(){if(ghost){ghost.remove();ghost=null}Array.from(board.querySelectorAll('.col.dragover,.card.dragging')).forEach(function(c){c.classList.remove('dragover');c.classList.remove('dragging')})}
  function colAt(x,y){var el=document.elementFromPoint(x,y);while(el&&!el.getAttribute('data-s'))el=el.parentElement;return el}
  function startGhost(card,x,y){ghost=card.cloneNode(true);ghost.className=card.className+' ghost-float';ghost.style.width=card.offsetWidth+'px';ghost.style.left=(x-40)+'px';ghost.style.top=(y-16)+'px';document.body.appendChild(ghost);card.classList.add('dragging')}
  board.addEventListener('dragstart',function(e){var card=e.target.closest('.card');if(!card||e.target.closest('a')){e.preventDefault();return}dragId=card.getAttribute('data-id');moved=true;try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(err){}card.classList.add('dragging')});
  board.addEventListener('dragend',function(){endGhost();dragId=null;moved=false});
  board.addEventListener('dragover',function(e){e.preventDefault();var col=e.target.closest('[data-s]');Array.from(board.querySelectorAll('.col.dragover')).forEach(function(c){if(c!==col)c.classList.remove('dragover')});if(col)col.classList.add('dragover')});
  board.addEventListener('drop',function(e){e.preventDefault();var col=e.target.closest('[data-s]');var id=dragId||((e.dataTransfer&&e.dataTransfer.getData('text/plain'))||'');endGhost();if(col&&id){justDragged=true;applyStatus(id,col.getAttribute('data-s'));setTimeout(function(){justDragged=false},80)}dragId=null;moved=false});
  board.addEventListener('pointerdown',function(e){if(e.button!=null&&e.button!==0)return;if(e.target.closest('a')||e.target.closest('button'))return;var card=e.target.closest('.card');if(!card)return;dragId=card.getAttribute('data-id');moved=false;sx=e.clientX;sy=e.clientY});
  board.addEventListener('pointermove',function(e){if(!dragId)return;if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){moved=true;var card=board.querySelector('.card[data-id="'+dragId+'"]');if(card)startGhost(card,e.clientX,e.clientY)}if(moved){if(e.cancelable)e.preventDefault();if(ghost){ghost.style.left=(e.clientX-40)+'px';ghost.style.top=(e.clientY-16)+'px'}var col=colAt(e.clientX,e.clientY);Array.from(board.querySelectorAll('.col.dragover')).forEach(function(c){if(c!==col)c.classList.remove('dragover')});if(col)col.classList.add('dragover')}});
  board.addEventListener('pointerup',function(e){if(!dragId)return;var id=dragId;if(moved){if(e.cancelable)e.preventDefault();var col=colAt(e.clientX,e.clientY);endGhost();justDragged=true;if(col)applyStatus(id,col.getAttribute('data-s'));setTimeout(function(){justDragged=false},80)}endGhost();dragId=null;moved=false});
  board.addEventListener('pointercancel',function(){endGhost();dragId=null;moved=false});
}
function g(pairs){return '<div class="grid">'+pairs.map(function(p){return '<div>'+p[0]+'</div><div>'+(p[1]===''||p[1]==null?'<span style="color:#98a2b3">—</span>':esc(p[1]))+'</div>'}).join('')+'</div>'}
function open(u,keep){var raw=base.filter(function(x){return x.url===u})[0];if(!raw)return;var r=row(raw);cur=u;var l=L[u]||{};
$('ph').innerHTML='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+pill(r.status)+'<span style="color:#667085;font-size:13px">'+r.key+' · updated '+rel(r.lastEditedISO)+'</span>'+(r._p?sChip(u):'')+'</div><h2>'+esc(r.ref)+'</h2><a class="b" style="text-decoration:none;display:inline-block" href="'+esc(r.url)+'" target="_blank" rel="noopener">Open in Notion ↗</a>';
var h='<div class="sec"><h4>Overview</h4>'+g([['Vendor / CM',r.vendor],['Ship Ref',r.shipRef],['Coordination',r.coordination],['Last edited',r.lastEdited]])+'</div>';
h+='<div class="sec"><h4>Route</h4>'+g([['From',r.from],['To',r.to]])+'</div>';
h+='<div class="sec"><h4>Action Required</h4>'+(r.action?'<div class="box">'+esc(r.action)+(r.deadline?'\n\nDeadline: '+dlab(r.deadline):'')+(stale(r)?'\n\n(Stale – no Notion update in 5+ days)':'')+'</div>':'<div class="empty">None</div>')+'</div>';
h+='<div class="sec"><h4>Ahmad Request ↔ CONVOY (from Notion)</h4>'+g([['Ahmad Request',r.ahmadRequest],['Request Status',r.requestStatus],['CONVOY Reply',r.convoyReply],['Comments Log',r.commentsLog]])+'</div>';
h+='<div class="sec"><h4>Timeline / notes on file</h4><div class="box" style="max-height:240px;overflow:auto">'+esc(r.notes||'—')+'</div></div>';
h+='<div class="sec"><h4>Freight</h4>'+g([['Tracking / PRO',r.pro],['Pallets',r.pallets],['Weight (lbs)',r.weight],['Class',r.class],['Freight cost',costLab(r)||'UNVERIFIED — no CHR invoice in the 8/1–11/13 Navisphere window'],['Cost detail',r.costDetail||'']])+'</div>';
if(VO){h+='<div class="sec"><p class="help">View only — edits are turned off on this link.</p></div>';$('pb').innerHTML=h;$('panel').classList.add('open');return;}
h+='<div class="sec"><h4>Edit shipment</h4><div class="actions">';
h+='<label>Status</label><select id="aS">'+ST.map(function(s){return '<option'+(r.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select>';
h+='<label>Tracking / PRO #</label><input id="aT" value="'+esc(r.pro||'')+'" placeholder="Tracking or PRO">';
h+='<div class="pair"><div><label>Pallets</label><input id="aPl" value="'+esc(r.pallets==null?'':r.pallets)+'" inputmode="numeric"></div><div><label>Weight (lbs)</label><input id="aW" value="'+esc(r.weight==null?'':r.weight)+'" inputmode="decimal"></div></div>';
h+='<label>Class</label><input id="aCl" value="'+esc(r.class||'')+'">';
h+='<label>Notes / Comments (appended; not a POD)</label><textarea id="aC" placeholder="Add a note or comment for CONVOY to write to the tracker"></textarea>';
h+='<label>Request for CONVOY</label><textarea id="aR" placeholder="What should CONVOY do?">'+esc(l.request||'')+'</textarea><label>Priority</label><select id="aP">'+['Normal','High','Urgent'].map(function(p){return '<option'+((l.priority||'Normal')===p?' selected':'')+'>'+p+'</option>'}).join('')+'</select>';
h+='<div class="row"><button class="b" id="aSave" type="button">Save changes</button>'+(L[u]?'<button class="b s" id="aClr" type="button">Discard local changes</button>':'')+'</div>';
if(l.comments&&l.comments.length)h+='<div class="log">'+l.comments.map(function(c){return '<div><b>'+esc(c.t)+'</b> — '+esc(c.x)+'</div>'}).join('')+'</div>';
h+='</div></div>';
$('pb').innerHTML=h;$('panel').classList.add('open');
$('aSave').onclick=function(){
  var s=$('aS').value,t=$('aT').value.trim(),pl=$('aPl').value.trim(),w=$('aW').value.trim(),cl=$('aCl').value.trim(),cmt=$('aC').value.trim(),rq=$('aR').value.trim(),pr=$('aP').value;
  var orig=row(raw);
  if(s&&s!==orig.status)queue(raw,'status',s);
  if(t!==String(orig.pro||''))queue(raw,'tracking',t);
  if(pl!==String(orig.pallets==null?'':orig.pallets))queue(raw,'pallets',pl);
  if(w!==String(orig.weight==null?'':orig.weight))queue(raw,'weight',w);
  if(cl!==String(orig.class||''))queue(raw,'class',cl);
  if(cmt)queue(raw,'comment',cmt);
  if(rq&&(rq!==(l.request||'')||pr!==(l.priority||'Normal')))queue(raw,'request',rq,pr);
  if(!SRV)toast('Saved locally — use Send to CONVOY');
};
if($('aClr'))$('aClr').onclick=function(){delete L[u];save()}
}
function summary(){return Object.keys(L).map(function(u){var n=L[u],p=[];if(n.status)p.push('status to '+n.status);if(n.tracking!=null)p.push('PRO/tracking: '+n.tracking);if(n.pallets!=null)p.push('pallets: '+n.pallets);if(n.weight!=null)p.push('weight: '+n.weight);if(n.class!=null)p.push('class: '+n.class);if(n.done)p.push('mark done');if(n.request)p.push('request ('+(n.priority||'Normal')+'): '+n.request);(n.comments||[]).forEach(function(c){p.push((c.f||'comment')+' ['+c.t+']: '+c.x)});return n.ref+': '+p.join('; ')+'\n  '+u}).join('\n')}
function renderTray(){if(VO)return;var s=summary();$('tray').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b>Pending for CONVOY ('+Object.keys(L).length+')</b><button class="b s" id="tX" type="button">Close</button></div><p class="help">'+(SRV?'Edits on this live link are queued to CONVOY automatically (status: Synced to CONVOY). ':'This viewer cannot reach the CONVOY server. Use <b>Send to CONVOY</b> and paste the text into chat.')+'</p><pre>'+esc(s||'No pending changes.')+'</pre><div class="row"><button class="b" id="tC" type="button">Send to CONVOY</button><button class="b s" id="tZ" type="button">Clear all</button></div><div id="sendWrap" style="display:none;margin-top:12px"><label class="help" style="display:block;margin-bottom:6px">Select all of the text below and paste it into chat with CONVOY:</label><textarea class="sendbox" id="tSend" readonly rows="10"></textarea></div>';
$('tX').onclick=function(){$('tray').classList.remove('open')};
$('tC').onclick=function(){var t='CONVOY updates from dashboard ('+new Date().toLocaleString()+'):\n'+(s||'No pending changes.');var w=$('sendWrap'),box=$('tSend');w.style.display='block';box.value=t;box.focus();box.select();$('tC').textContent='Text ready to copy'};
$('tZ').onclick=function(){if($('tZ').dataset.ok){L={};save();return}$('tZ').dataset.ok='1';$('tZ').textContent='Click again to confirm clear';setTimeout(function(){if($('tZ')){$('tZ').dataset.ok='';$('tZ').textContent='Clear all'}},2500)}}
if(!VO)$('trayBtn').onclick=function(){$('tray').classList.toggle('open')};
function closeP(){$('panel').classList.remove('open');cur=null}$('px').onclick=closeP;
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeP();$('tray').classList.remove('open')}});
$('vB').onclick=function(){setView('board')};$('vT').onclick=function(){setView('table')};$('vS').onclick=function(){setView('spend')};['vB','vT','vS'].forEach(function(id){if($(id))$(id).className=((id==='vB'&&view==='board')||(id==='vT'&&view==='table')||(id==='vS'&&view==='spend'))?'on':''});
['q','fv'].forEach(function(i){$(i).addEventListener('input',render)});
if(SRV){api('/api/shipments').then(function(x){return x.json()}).then(function(j){if(j.rows){base=j.rows;D.meta=j.meta;if(j.freight)D.freight=j.freight;$('asof').textContent='Data as of '+D.meta.dataAsOf+' · '+D.meta.rowCount+' shipments (CM and inventory transfers only) · live sync on'}render()}).catch(function(){});poll();setInterval(poll,30000)}
render()})();
